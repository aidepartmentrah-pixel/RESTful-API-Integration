openapi: 3.0.3
info:
  title: Hospital Directory Read API
  version: 1.2.0
  description: |
    Read-only internal API for patients, doctors, and workers. Used by HCAT and HCopilot.

    **v1.2 as DELIVERED by 3iSoft** ("HIS API - v1.2 Additions", 18 Nov 2026)
    and verified on the real servers the same day (offline test kit:
    `offline_test_kit/`, 70 passed / 1 failed - the only failure was the
    missing ER key). What v1.2 added on top of v1.1:

      - `GET /patients/father-names` - as we proposed.
      - `GET /hr-workers`, `GET /hr-workers/{employee_id}` - NEW endpoint.
        We had asked for section/administration names on `/workers`;
        3iSoft built the HR hierarchy as its own endpoint instead, and
        `/workers` is unchanged from v1.1.
      - `GET /current-visits` on the separate **ER API**
        (`/his-er/api/er/v1`, its **own key**) - not on the Directory API.

    `x-status`: `implemented` = in production since v1.1; `delivered` =
    added by 3iSoft in v1.2 and verified on the real server.

    Where things live (confirmed 18 Nov 2026):
      - Directory API: `http://malin:8080/his-general/api/directory/v1`
      - ER API: `http://meraj:8080/his-er/api/er/v1` (NOT malin)
    The mock (v1.2-dev, port 6001) serves both on the same paths, plus the
    mock's older `/api/directory/v1` prefix for compatibility.

    Dropped before delivery (4 Nov 2026 meeting): `GET /patients/first-names`
    and `Patient.encounter_type`.

    Transport notes:
      - Every response is `application/json; charset=utf-8`.
      - All endpoints are GET; the API is strictly read-only.
      - Every endpoint except `/health` requires the `X-API-Key` header.
      - The ER API uses a different key from the Directory API.

servers:
- url: http://malin:8080/his-general/api/directory/v1
  description: Real Directory API (hospital network)
- url: http://localhost:6001/his-general/api/directory/v1
  description: Mock, v1.2-dev
- url: http://localhost:18080/his-general/api/directory/v1
  description: 3iSoft developer machine (their documents use this)

security:
- ApiKeyAuth: []

tags:
- name: Health
  description: Public liveness/readiness probe.
- name: Patients
  description: Patient lookup. Search is restricted (see the endpoint description).
- name: Doctors
  description: Doctor search and lookup, backed by the his-general database.
- name: Workers
  description: |
    Employee listing and lookup. Backed by the separate HR application (called
    over HTTP on the same WildFly instance), NOT by the his-general database.
- name: HR Workers
  x-status: delivered
  description: |
    Workers with their place in the HR tree: administration (ادارة) >
    section (دائرة) > department (قسم). Added by 3iSoft in v1.2.
- name: ER
  x-status: delivered
  description: |
    The ER API: a separate 3iSoft application (meraj:8080) with its own
    key. Read-only live roster for HCopilot.

paths:
  /health:
    get:
      tags:
      - Health
      x-status: implemented
      summary: Check API health
      description: |
        Public — no API key required. Returns `healthy` only when the required
        dependency (the his-general database) actually answers a probe query
        (`SELECT 1`); any failure yields `503` with status `unhealthy`.

        `service` is always `his-general-directory` and `api_version` is always
        `1.0.0` (the API contract version, independent of this document's version).
      security: []
      responses:
        '200':
          description: API and required dependency are healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: healthy
                service: his-general-directory
                api_version: 1.0.0
                timestamp: '2026-09-04T10:15:00Z'
        '503':
          description: API dependency unavailable (database probe failed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: unhealthy
                service: his-general-directory
                api_version: 1.0.0
                timestamp: '2026-09-04T10:15:00Z'

  /patients:
    get:
      tags:
      - Patients
      x-status: implemented
      summary: Search patients (search is required and restricted)
      description: |
        A search must be one of exactly two shapes:

          a) `patient_id` — exact numeric id match; or
          b) `first_name` AND `father_name` AND `last_name` — all three together.

        Any other combination (a name field on its own, or first + last without
        father) is rejected with `422 VALIDATION_ERROR` and the message:
        `Provide 'patient_id', or all three of 'first_name', 'father_name' and 'last_name'`.
        This is intentional: a patient can never be found from a partial name.

        Name matching semantics:
          - Each field is matched case-insensitively as a **substring** against
            **only its own column** — `first_name` against the first-name column,
            `father_name` against the father-name column, `last_name` against the
            last-name column. Fields are never cross-matched.
          - Each field matches either the Arabic **or** the English variant of that
            column.
          - The three conditions are AND-ed: a patient must satisfy all three.
          - Supplying `patient_id` together with name fields AND-s them as well.

        Results are ordered by Arabic first name, then Arabic last name.
      parameters:
      - $ref: '#/components/parameters/PatientIdFilter'
      - $ref: '#/components/parameters/FirstName'
      - $ref: '#/components/parameters/FatherName'
      - $ref: '#/components/parameters/LastName'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: |
            Matching patients. `total` is the full match count ignoring
            `limit`/`offset`. An empty `items` array with `total: 0` is a normal
            200 response — not a 404.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: |
            Search criteria missing/incomplete, or `limit`/`offset` out of range.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: VALIDATION_ERROR
                message: Provide 'patient_id', or all three of 'first_name', 'father_name'
                  and 'last_name'
        '500':
          $ref: '#/components/responses/ServerError'

  /patients/{patient_id}:
    get:
      tags:
      - Patients
      x-status: implemented
      summary: Get one exact patient
      description: |
        Exact lookup by primary key. A non-numeric id can never match a record and
        is therefore reported as `404 PATIENT_NOT_FOUND` (not `400`).
      parameters:
      - name: patient_id
        in: path
        required: true
        description: Numeric patient id, e.g. `10025`.
        schema:
          type: string
      responses:
        '200':
          description: Patient
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No such patient (error code `PATIENT_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: PATIENT_NOT_FOUND
                message: The requested patient was not found
        '500':
          $ref: '#/components/responses/ServerError'

  /patients/father-names:
    get:
      tags:
      - Patients
      x-status: delivered
      summary: List candidate father names for a first+last name pair
      description: |
        Returns the distinct father-name values on file among patients
        matching `first_name` + `last_name`, ordered by how many patient
        records exist under each (most common first; ties ordered by
        `father_name` so the list is stable between calls). Blank father
        names are excluded. Replaces a client-side 32-candidate guessing
        loop with one authoritative lookup. Does not return patient records
        — once a `father_name` is confirmed, call `GET /patients` with all
        three fields.

        See `requirements/1-father-name-candidates/requirement.md` for the
        full rationale.
      parameters:
      - name: first_name
        in: query
        required: false
        description: |
          Not enforced as `required` at the schema level (matches the
          `/patients` name parameters' convention in v1.1) — but a request
          missing or blank (whitespace-only) value for this or `last_name`
          is rejected with `422 VALIDATION_ERROR` at runtime; both are
          effectively mandatory.
        schema:
          type: string
          minLength: 1
      - name: last_name
        in: query
        required: false
        schema:
          type: string
          minLength: 1
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      responses:
        '200':
          description: Candidate father names, ordered by patient_count descending, then father_name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FatherNameCandidatesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: '`first_name` or `last_name` missing/empty, or `limit` out of range.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missing_name:
                  value:
                    error: VALIDATION_ERROR
                    message: Both 'first_name' and 'last_name' are required
                bad_limit:
                  value:
                    error: VALIDATION_ERROR
                    message: limit must be between 1 and 200
        '500':
          $ref: '#/components/responses/ServerError'


  /doctors:
    get:
      tags:
      - Doctors
      x-status: implemented
      summary: Search or list doctors
      description: |
        Search is optional — with no parameters this lists active doctors, ordered
        by full name.

        When `q` is supplied it is matched case-insensitively as a **substring**
        against any of: full name, first name, father name, last name, assistant
        number, or the numeric id rendered as text. A hit on any one of these
        qualifies (OR).
      parameters:
      - $ref: '#/components/parameters/OptionalQuery'
      - $ref: '#/components/parameters/ActiveOnly'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Matching doctors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoctorListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'

  /doctors/{doctor_id}:
    get:
      tags:
      - Doctors
      x-status: implemented
      summary: Get one doctor
      description: |
        Exact lookup by primary key. Ignores `active_only` — an inactive doctor is
        still returned (with `is_active: false`). A non-numeric id yields
        `404 DOCTOR_NOT_FOUND`.
      parameters:
      - name: doctor_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Doctor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Doctor'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No such doctor (error code `DOCTOR_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerError'

  /workers:
    get:
      tags:
      - Workers
      x-status: implemented
      summary: List workers (active employees)
      description: |
        Data source: the separate HR application. No `q` or `active_only` —
        always lists active employees only (confirmed the real server
        silently ignores `q` on this endpoint; the mock no longer offers it
        either).
      parameters:
      - $ref: '#/components/parameters/WorkerLimit'
      - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Workers page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /workers/{employee_id}:
    get:
      tags:
      - Workers
      x-status: implemented
      summary: Get one worker
      description: |
        Exact lookup by HR employee id. `is_active` is always `true` for any
        employee found by this route (HR exposes no active flag on this call).
      parameters:
      - name: employee_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Worker
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Worker'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No such worker (error code `WORKER_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /hr-workers:
    get:
      tags:
      - HR Workers
      x-status: delivered
      summary: List workers with their HR administration / section / department
      description: |
        A worker's unit is the unit of their current basic job; the three
        levels are found by walking up the HR tree from that unit. A worker
        placed directly in a section has `department_*` null, and so on.

        Filter rules:
          - filters take the unit **name**, not the id;
          - names are compared after trimming spaces and unifying spelling
            (أ / إ / آ -> ا, ة -> ه, ى -> ي), so `الادارة الطبيه` matches
            `الإدارة الطبية`;
          - `administration` returns its workers and the workers of every
            section / department under it; `section` likewise;
          - several filters together are combined with AND;
          - if two units share a name, workers of both are returned;
          - inactive units still match and are still shown;
          - an unknown name (or a name at the wrong level) returns an empty
            list, not an error; an empty filter (`?section=`) is ignored;
          - filtering happens before paging, so `total` counts the matches.
      parameters:
      - name: administration
        in: query
        required: false
        description: Administration (ادارة) name.
        schema:
          type: string
      - name: section
        in: query
        required: false
        description: Section (دائرة) name.
        schema:
          type: string
      - name: department
        in: query
        required: false
        description: Department (قسم) name.
        schema:
          type: string
      - $ref: '#/components/parameters/WorkerLimit'
      - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Workers page with their HR placement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HrWorkerListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /hr-workers/{employee_id}:
    get:
      tags:
      - HR Workers
      x-status: delivered
      summary: Get one worker with their HR placement
      description: Same fields as a list item, no envelope.
      parameters:
      - name: employee_id
        in: path
        required: true
        schema:
          type: string
          example: '6080.997'
      responses:
        '200':
          description: Worker
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HrWorker'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No such worker (error code `WORKER_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /current-visits:
    servers:
    - url: http://meraj:8080/his-er/api/er/v1
      description: Real ER API (hospital network) - on meraj, not malin
    - url: http://localhost:6001/his-er/api/er/v1
      description: Mock, v1.2-dev
    get:
      tags:
      - ER
      x-status: delivered
      security:
      - ErApiKeyAuth: []
      summary: Live roster of patients currently in the ER (for HCopilot)
      description: |
        Every active ER visit whose state is "in preparation", as one full
        snapshot (no paging): the caller detects departures by comparing
        the `er_visit_id`s of two calls. Ordered by `arrival_time`, earliest
        first; equal times by visit id. Any field without a value is `null`
        (never omitted). No patients is a normal `200` with an empty list.
      responses:
        '200':
          description: Full current ER roster.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErVisitListResponse'
              example:
                success: true
                items:
                - er_visit_id: '8441'
                  first_name: أحمد
                  father_name: خليل
                  last_name: منصور
                  arrival_time: '2026-11-10T07:15:00+02:00'
                  gender: ذكر
                  age: 48
                  chief_complaint: ألم في الصدر وضيق نفس
                total: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Wrong path (error code `NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Any method other than GET (error code `METHOD_NOT_ALLOWED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerError'

components:
  securitySchemes:
    ErApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: The ER API's own key - different from the Directory API key.
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        Required on every endpoint except `/health`. Comparison is length-constant.

  parameters:
    PatientIdFilter:
      name: patient_id
      in: query
      required: false
      schema:
        type: string
      example: '10025'
    FirstName:
      name: first_name
      in: query
      required: false
      schema:
        type: string
        minLength: 1
    FatherName:
      name: father_name
      in: query
      required: false
      schema:
        type: string
        minLength: 1
    LastName:
      name: last_name
      in: query
      required: false
      schema:
        type: string
        minLength: 1
    OptionalQuery:
      name: q
      in: query
      required: false
      schema:
        type: string
        minLength: 1
    ActiveOnly:
      name: active_only
      in: query
      required: false
      schema:
        type: boolean
        default: true
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    WorkerLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 10
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0

  schemas:
    Patient:
      type: object
      required:
      - patient_id
      - full_name
      properties:
        patient_id:
          type: string
          example: '10025'
        full_name:
          type: string
          nullable: true
        first_name:
          type: string
          nullable: true
        last_name:
          type: string
          nullable: true
        birth_date:
          type: string
          format: date
          nullable: true
        age:
          type: integer
          minimum: 0
          maximum: 150
          nullable: true
        sex:
          type: string
          nullable: true

    Doctor:
      type: object
      required:
      - doctor_id
      - full_name
      - is_active
      properties:
        doctor_id:
          type: string
          example: '116'
        full_name:
          type: string
          nullable: true
        specialty_id:
          type: string
          nullable: true
        specialty_name:
          type: string
          nullable: true
        department_id:
          type: string
          nullable: true
        department_name:
          type: string
          nullable: true
        is_active:
          type: boolean

    Worker:
      type: object
      required:
      - employee_id
      - full_name
      - is_active
      properties:
        employee_id:
          type: string
          example: '205'
        full_name:
          type: string
          nullable: true
        job_id:
          type: string
          nullable: true
        job_title:
          type: string
          nullable: true
        department_id:
          type: string
          nullable: true
        department_name:
          type: string
          nullable: true
        section_id:
          type: string
          nullable: true
        administration_id:
          type: string
          nullable: true
        is_manager:
          type: boolean
          nullable: true
        is_active:
          type: boolean

    FatherNameCandidate:
      type: object
      x-status: implemented
      required:
      - father_name
      - patient_count
      properties:
        father_name:
          type: string
          example: 'محمد'
        patient_count:
          type: integer
          minimum: 1

    FatherNameCandidatesResponse:
      type: object
      x-status: implemented
      required:
      - first_name
      - last_name
      - candidates
      - total_candidates
      properties:
        success:
          type: boolean
          example: true
        first_name:
          type: string
        last_name:
          type: string
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/FatherNameCandidate'
        total_candidates:
          type: integer
          minimum: 0
          description: |
            Number of distinct candidates before `limit` is applied, so a
            caller can show "showing 50 of 120".

    HrWorker:
      type: object
      x-status: delivered
      description: Every field is always present; null when not known.
      required:
      - employee_id
      - full_name
      - job_id
      - job_title
      - administration_id
      - administration_name
      - section_id
      - section_name
      - department_id
      - department_name
      - is_manager
      - is_active
      properties:
        employee_id:
          type: string
          example: '6080.995'
        full_name:
          type: string
          nullable: true
          example: سامر خليل عيسى
        job_id:
          type: string
          nullable: true
        job_title:
          type: string
          nullable: true
          example: ممرض
        administration_id:
          type: string
          nullable: true
        administration_name:
          type: string
          nullable: true
          example: الإدارة الطبية
        section_id:
          type: string
          nullable: true
        section_name:
          type: string
          nullable: true
          example: دائرة التمريض
        department_id:
          type: string
          nullable: true
        department_name:
          type: string
          nullable: true
          example: قسم الطوارئ
          description: |
            The HR department (قسم). Not necessarily the same as
            `Worker.department_name` on `/workers`, which comes from the
            his-general Department table.
        is_manager:
          type: boolean
          nullable: true
        is_active:
          type: boolean

    HrWorkerListResponse:
      allOf:
      - $ref: '#/components/schemas/ListEnvelope'
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/HrWorker'

    ErVisit:
      type: object
      x-status: delivered
      description: Every field is always present; null when it has no value.
      required:
      - er_visit_id
      - first_name
      - father_name
      - last_name
      - arrival_time
      - gender
      - age
      - chief_complaint
      properties:
        er_visit_id:
          type: string
          description: Visit number as shown on the ER list page. Opaque - do not parse.
        first_name:
          type: string
          nullable: true
        father_name:
          type: string
          nullable: true
        last_name:
          type: string
          nullable: true
        arrival_time:
          type: string
          format: date-time
          description: ISO 8601 with the server's offset (Asia/Beirut, +02:00 / +03:00).
        gender:
          type: string
          nullable: true
          description: ذكر / انثى, or the raw code if it cannot be resolved.
        age:
          type: integer
          nullable: true
          description: Whole years from the birth date; null if no birth date.
        chief_complaint:
          type: string
          nullable: true
          description: The visit's attendance notes (free text); null if empty.

    ErVisitListResponse:
      type: object
      x-status: delivered
      required:
      - success
      - items
      - total
      properties:
        success:
          type: boolean
          example: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/ErVisit'
        total:
          type: integer
          minimum: 0
          description: Number of items. No paging - always the full snapshot.

    PatientListResponse:
      allOf:
      - $ref: '#/components/schemas/ListEnvelope'
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/Patient'
    DoctorListResponse:
      allOf:
      - $ref: '#/components/schemas/ListEnvelope'
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/Doctor'
    WorkerListResponse:
      allOf:
      - $ref: '#/components/schemas/ListEnvelope'
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/Worker'

    ListEnvelope:
      type: object
      required:
      - success
      - items
      - total
      - limit
      - offset
      properties:
        success:
          type: boolean
          example: true
        items:
          type: array
          items: {}
        total:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
        offset:
          type: integer
          minimum: 0

    Error:
      type: object
      required:
      - error
      - message
      properties:
        error:
          type: string
          example: PATIENT_NOT_FOUND
        message:
          type: string
          example: The requested patient was not found

    HealthResponse:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - healthy
          - unhealthy
        service:
          type: string
        api_version:
          type: string
        timestamp:
          type: string
          format: date-time
      additionalProperties: true

  responses:
    Unauthorized:
      description: Missing or invalid API key (code `UNAUTHORIZED`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: UNAUTHORIZED
            message: Missing or invalid API key
    ValidationError:
      description: Invalid parameter value (code `VALIDATION_ERROR`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServerError:
      description: Unexpected server error (code `SERVER_ERROR`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: API dependency unavailable (code `SERVICE_UNAVAILABLE`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
